<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Nova senha - Curso de Eletricista</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="marca"><span class="raio">⚡</span> Curso de Eletricista</div>
  </header>

  <main class="palco">
    <section class="cartao">
      <h1>Criar nova senha</h1>
      <p class="apoio">Escolha uma senha nova para sua conta.</p>

      <div id="aviso" class="aviso"></div>

      <form id="form-redefinir" novalidate>
        <div class="campo">
          <label for="senha">Nova senha</label>
          <input id="senha" type="password" autocomplete="new-password" placeholder="Minimo 6 caracteres" minlength="6" required>
        </div>
        <div class="campo">
          <label for="senha2">Repetir nova senha</label>
          <input id="senha2" type="password" autocomplete="new-password" placeholder="Repita a senha" minlength="6" required>
        </div>
        <button class="btn" type="submit" id="btn-salvar">Salvar nova senha</button>
      </form>

      <div class="linha-links centro">
        <a href="/index.html">Voltar para o login</a>
      </div>
    </section>

    <p class="rodape">Curso de Eletricista • learis.com.br</p>
  </main>

  <script src="/auth.js"></script>
  <script>
    (function () {
      const aviso = document.getElementById('aviso');
      const form = document.getElementById('form-redefinir');
      const botao = document.getElementById('btn-salvar');
      const token = new URLSearchParams(window.location.search).get('t');

      if (!token) {
        mostrarAviso(aviso, 'erro', 'Link invalido ou incompleto. <a href="/recuperar-senha.html">Solicitar novo link</a>');
        form.querySelectorAll('input, button').forEach(function (el) { el.disabled = true; });
        return;
      }

      form.addEventListener('submit', async function (evento) {
        evento.preventDefault();
        esconderAviso(aviso);

        const senha = document.getElementById('senha').value;
        const senha2 = document.getElementById('senha2').value;

        if (senha.length < 6) {
          mostrarAviso(aviso, 'erro', 'A senha precisa ter no minimo 6 caracteres.');
          return;
        }
        if (senha !== senha2) {
          mostrarAviso(aviso, 'erro', 'As senhas nao conferem.');
          return;
        }

        ocupado(botao, 'Salvando...');
        const r = await api('/api/auth/redefinir-senha', { body: { t: token, senha: senha } });
        liberarBotao(botao);

        if (r.ok && r.dados.success) {
          mostrarAviso(aviso, 'ok', (r.dados.message || 'Senha alterada!') + ' <a href="/index.html">Entrar</a>');
          form.reset();
          form.querySelectorAll('input, button').forEach(function (el) { el.disabled = true; });
        } else {
          mostrarAviso(aviso, 'erro', r.dados.message || 'Nao foi possivel alterar a senha.');
        }
      });
    })();
  </script>
</body>
</html>
