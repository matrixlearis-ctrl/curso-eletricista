<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Criar conta - Curso de Eletricista</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="marca"><span class="raio">⚡</span> Curso de Eletricista</div>
  </header>

  <main class="palco">
    <section class="cartao">
      <h1>Criar sua conta</h1>
      <p class="apoio">Leva menos de um minuto. Depois voce confirma o e-mail e libera o acesso.</p>

      <div id="aviso" class="aviso"></div>

      <form id="form-cadastro" novalidate>
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome" required>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="voce@email.com" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="new-password" placeholder="Minimo 6 caracteres" minlength="6" required>
          <small class="dica">Use pelo menos 6 caracteres.</small>
        </div>
        <div class="campo">
          <label for="senha2">Repetir senha</label>
          <input id="senha2" name="senha2" type="password" autocomplete="new-password" placeholder="Repita a senha" minlength="6" required>
        </div>

        <button class="btn" type="submit" id="btn-criar">Criar conta</button>
      </form>

      <div class="linha-links centro">
        <a href="/index.html">Ja tenho conta</a>
      </div>
    </section>

    <p class="rodape">Curso de Eletricista • learis.com.br</p>
  </main>

  <script src="/config-site.js"></script>
  <script src="/auth.js"></script>
  <script>
    (function () {
      const aviso = document.getElementById('aviso');
      const form = document.getElementById('form-cadastro');
      const botao = document.getElementById('btn-criar');
      const params = new URLSearchParams(window.location.search);

      // Reenvio de confirmacao (vindo da tela de login)
      const emailReenviar = params.get('reenviar');
      if (emailReenviar) {
        document.getElementById('email').value = emailReenviar;
        mostrarAviso(aviso, 'info', 'Sua conta existe, mas o e-mail ainda nao foi confirmado. Clique em <b>Reenviar confirmacao</b> abaixo.');
        adicionarBotaoReenviar(emailReenviar);
      }

      function adicionarBotaoReenviar(email) {
        if (document.getElementById('btn-reenviar')) return;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.id = 'btn-reenviar';
        btn.className = 'btn contorno';
        btn.style.marginTop = '10px';
        btn.textContent = 'Reenviar confirmacao';
        btn.addEventListener('click', async function () {
          ocupado(btn, 'Enviando...');
          const r = await api('/api/auth/reenviar-confirmacao', { body: { email: email } });
          liberarBotao(btn);
          mostrarAviso(aviso, r.ok ? 'ok' : 'erro', r.dados.message + linkDevHtml(r.dados));
        });
        form.after(btn);
      }

      function linkDevHtml(dados) {
        if (!dados || !dados.linkDev) return '';
        return '<div style="margin-top:14px">' +
          '<a class="btn" href="' + dados.linkDev + '" style="background:#38bdf8;color:#04131d">Confirmar meu e-mail agora</a>' +
          '<div style="margin-top:8px;font-size:12px;line-height:1.4">' +
          '<b>Modo local:</b> nenhum e-mail e enviado enquanto o Resend nao estiver configurado. ' +
          'Use o botao acima (o mesmo link aparece na janela preta do servidor).' +
          '</div></div>';
      }

      form.addEventListener('submit', async function (evento) {
        evento.preventDefault();
        esconderAviso(aviso);

        const nome = document.getElementById('nome').value.trim();
        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('senha').value;
        const senha2 = document.getElementById('senha2').value;

        if (!nome || !email || !senha) {
          mostrarAviso(aviso, 'erro', 'Preencha todos os campos.');
          return;
        }
        if (senha.length < 6) {
          mostrarAviso(aviso, 'erro', 'A senha precisa ter no minimo 6 caracteres.');
          return;
        }
        if (senha !== senha2) {
          mostrarAviso(aviso, 'erro', 'As senhas nao conferem.');
          return;
        }

        ocupado(botao, 'Criando conta...');
        const r = await api('/api/auth/cadastro', { body: { nome: nome, email: email, senha: senha } });
        liberarBotao(botao);

        if (!r.ok || !r.dados.success) {
          if (r.status === 409) adicionarBotaoReenviar(email);
          mostrarAviso(aviso, 'erro', r.dados.message || 'Nao foi possivel criar a conta.');
          return;
        }

        const extra = linkDevHtml(r.dados);
        mostrarAviso(aviso, 'ok', (r.dados.message || 'Conta criada!') + extra);

        if (r.dados.linkDev) {
          adicionarBotaoReenviar(email);
        } else {
          form.reset();
        }
      });
    })();
  </script>
</body>
</html>
